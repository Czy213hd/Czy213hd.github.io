  Hi, I'm Zhongyu Chen, an undergraduate student in Zhejiang University and University of Illinois Urbana-Champaign. I'm interested in machine learning and robotics.

content:
  - title: Projects
    layout: list
    content:
      - layout: left
        title: Failure-aware diffusion for robotic manipulation
        link: intl.zju.edu.cn
        sub_title: Physical Intelligent Lab, ZJU–UIUC · Undergraduate research
        caption: Feb 2026 – Present
        quote: >
          Diffusion policies and ACT baselines on the ARX-L5 platform for contact-rich tasks.
        description: |
          - Deployed the ARX-L5 arm, collected multi-modal teleoperation data, and iterated on training pipelines.
          - Established a bottle-capping baseline with <mark>ACT</mark> for imitation from expert demos.
          - Built a <mark>diffusion</mark>-based policy on mixed success and failure trials to raise success rate.

      - layout: left
        title: Reinforcement learning for quadruped locomotion (Jueying-Lite3)
        link: intl.zju.edu.cn
        sub_title: Physical Intelligent Lab, ZJU–UIUC · Undergraduate research
        caption: Apr 2026 – Present
        quote: >
          PPO locomotion in MJLab with emphasis on sim-to-real transfer.
        description: |
          - Trained a <mark>PPO</mark> policy for the Jueying-Lite3 quadruped in the <mark>MJLab</mark> framework.
          - Ran parallel training with four robots to speed up data collection and improve robustness.
          - Explored Sim2Sim / Sim2Real, reward shaping, and domain randomization for deployment.

      - layout: left
        title: UAV facade crack detection and inspection path planning
        link: zju.edu.cn
        sub_title: Summer research, ZJU · Advisor Prof. Jiangpeng Shu
        caption: Jun 2024 – Sep 2024
        quote: >
          UAV-based glass curtain wall inspection with YOLOv8 and RRT planning.
        description: |
          - Studied UAV-based crack detection with <mark>YOLOv8</mark> on facade imagery.
          - Built and annotated 8,436 images for multi-type crack classification.
          - Implemented <mark>RRT</mark>-style planning for inspection paths along building surfaces.

      - layout: left
        title: Swarm underwater robots — structure and control
        link: zju.edu.cn
        sub_title: Xingwen Zheng Research Group, ZJU · Advisor Prof. Xingwen Zheng
        caption: Oct 2025 – Present
        quote: >
          Modular docking and full-body CAD for networked underwater robots.
        description: |
          - Designed a modular docking mechanism for autonomous multi-robot connection.
          - Modeled the full vehicle structure in <mark>CAD</mark> (Fusion 360 / SolidWorks workflow).

