<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery -- Zhongyu Chen</title>
  <meta name="description" content="Gallery of Zhongyu Chen.">
  <link rel="icon" href="assets/img/robot-favicon.svg?v=20260708" type="image/svg+xml">
  <link rel="shortcut icon" href="assets/img/robot-favicon.svg?v=20260708" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/a860a211d3.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="assets/css/font_sans_serif.css">
  <link rel="stylesheet" href="assets/css/theme-luka.css?v=20260720-gallery-columns">
</head>
<body class="theme-luka gallery-page">
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./">Home</a>
      </div>
      <div class="nav-right">
        <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrapper">
    <section class="content">
      <div class="section" id="me">
        <h1 class="section-title">Me 🤵</h1>
        <div class="section-body">
          <div class="gallery-masonry">
            <figure class="gallery-item">
              <img src="assets/img/gallery/IMG_8739.JPG" alt="Gallery photo" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/gallery/Weixin%20Image_20260701201127_340_321.jpg" alt="Gallery photo" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/gallery/IMG_0537.JPG" alt="Gallery photo" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/gallery/fxn%202025-11-21%20201331.804.JPG" alt="Gallery photo" loading="lazy">
            </figure>
          </div>
        </div>
      </div>

      <div class="section" id="robo">
        <h2 class="section-title">Robo 🤖</h2>
        <div class="section-body">
          <div class="gallery-masonry">
            <figure class="gallery-item">
              <img src="assets/img/gallery/robo/Weixin%20Image_20260720003728_352_321.jpg" alt="Robot gallery photo" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/gallery/robo/Weixin%20Image_20260720004032_354_321.jpg" alt="Robot gallery photo" loading="lazy">
            </figure>
          </div>
        </div>
      </div>

      <div class="section" id="view">
        <h2 class="section-title">View 🏖️</h2>
        <div class="section-body">
          <div class="gallery-masonry">
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function() {
      const themeToggle = document.getElementById('themeToggle');
      const icon = themeToggle.querySelector('i');

      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        icon.classList.toggle('fa-sun', isDark);
        icon.classList.toggle('fa-moon', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

      themeToggle.addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setTheme(!isDark);
      });

      document.querySelectorAll('.section').forEach(function(el) {
        el.classList.add('visible');
      });
    })();
  </script>
</body>
</html>
