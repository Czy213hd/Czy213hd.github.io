<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery -- Zhongyu Chen</title>
  <meta name="description" content="Gallery of Zhongyu Chen.">
  <link rel="icon" href="assets/img/robot-favicon.svg?v=20260708" type="image/svg+xml">
  <link rel="shortcut icon" href="assets/img/robot-favicon.svg?v=20260708" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/a860a211d3.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="assets/css/font_sans_serif.css">
  <link rel="stylesheet" href="assets/css/theme-luka.css?v=20260714-gallery-masonry">
</head>
<body class="theme-luka gallery-page">
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./">Home</a>
      </div>
      <div class="nav-right">
        <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrapper">
    <section class="content">
      <div class="section" id="gallery">
        <h1 class="section-title">Gallery</h1>
        <div class="section-body">
          <div class="gallery-masonry">
            <figure class="gallery-item">
              <img src="assets/img/avatat.png" alt="Portrait of Zhongyu Chen" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project1/combined.png" alt="Robot design overview" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project1/1428473340530998e3b3f6daa2f58cb8.png" alt="Robot prototype detail" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project1/6ada8061fff4bf905d83fafb8b1f847e.png" alt="Robot mechanism detail" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project1/d482173585e7d813c8fc237047ad7073.png" alt="Robot assembly detail" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project5/image.png" alt="Research project image" loading="lazy">
            </figure>
            <figure class="gallery-item">
              <img src="assets/img/project4/4a6e9755-bff0-43b7-8bb3-e62cdaa7dce3.png" alt="Project photo" loading="lazy">
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function() {
      const themeToggle = document.getElementById('themeToggle');
      const icon = themeToggle.querySelector('i');

      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        icon.classList.toggle('fa-sun', isDark);
        icon.classList.toggle('fa-moon', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

      themeToggle.addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setTheme(!isDark);
      });

      document.querySelectorAll('.section').forEach(function(el) {
        el.classList.add('visible');
      });
    })();
  </script>
</body>
</html>
