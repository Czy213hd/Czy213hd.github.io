# Deploy this repo as static GitHub Pages (HTML at repository root).
# After merging: Repo → Settings → Pages → Build and deployment → Source: GitHub Actions.
# (If you use “Deploy from a branch” instead, you can delete this workflow.)

name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static files
        run: |
          mkdir -p _site
          cp index.html _site/
          test -f .nojekyll && cp .nojekyll _site/ || true
          cp -r assets _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
